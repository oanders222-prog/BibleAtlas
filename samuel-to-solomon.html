const $=s=>document.querySelector(s),
ns='http://www.w3.org/2000/svg';
let i=0;
function el(t,
a,
p) {
  const e=document.createElementNS(ns,
  t);
  Object.entries(a|| {
    
  }).forEach(([k,
  v])=>e.setAttribute(k,
  v));
  p.appendChild(e);
  return e
}function line(a,
b,
c='red') {
  const [x1,
  y1]=P[a],
  [tx,
  ty]=P[b],
  dx=tx-x1,
  dy=ty-y1,
  len=Math.hypot(dx,
  dy)||1,
  x2=tx-dx/len*13,
  y2=ty-dy/len*13;
  el('path',
   {
    d:`M${x1} ${y1} Q${(x1+x2)/2} ${(y1+y2)/2-28} ${x2} ${y2}`,
    class:'route '+(c==='blue'?'blue':c==='gold'?'gold':'')
  },
  $('#routes'))
}function render() {
  const s=stages[i];
  ['zones',
  'routes',
  'labels',
  'places'].forEach(x=>$('#'+x).innerHTML='');
  if(s.zones) {
    el('path',
     {
      d:'M190 105 L815 45 L690 330 L650 610 L515 650 L300 625 L145 510 L185 250 Z', class:'realm'
    },
    $('#zones'));
    el('path',
     {
      d:'M245 210 L500 160 L545 560 L300 625 L145 510 L175 300 Z', class:'core'
    },
    $('#zones'))
  }(s.route?[s.route]:[]).forEach(r=> {
    for(let j=0;
    j<r.length-1;
    j++)line(r[j],
    r[j+1],
    'blue')
  });
  (s.invasions||[]).forEach(([a,
  b])=>line(a,
  b));
  (s.outward||[]).forEach(([a,
  b,
  c])=>line(a,
  b,
  c));
  (s.labels||[]).forEach(([t,
  x,
  y])=> {
    const q=el('text',
     {
      x, y, class:'region'
    },
    $('#labels'));
    q.textContent=t
  });
  (s.marks||[]).forEach(([n,
  c])=> {
    const [x,
    y]=P[n],
    g=el('g',
     {
      class:'place '+c
    },
    $('#places'));
    el('circle',
     {
      cx:x, cy:y, r:7
    },
    g);
    const q=el('text',
     {
      x:x+11, y:y+5
    },
    g);
    q.textContent=n.replace(/([a-z])([A-Z])/g,
    '$1-$2')
  });
  $('#chapter').textContent=s.ch;
  $('#heading').textContent=s.title;
  $('#summary').textContent=s.summary;
  $('#facts').innerHTML=s.facts.map(x=>'<li>'+x+'</li>').join('');
  $('#note').textContent=s.note;
  $('#legend').textContent=s.legend;
  $('#progress').textContent=`Stage ${i+1} of ${stages.length}`;
  $('#back').disabled=i===0;
  $('#next').textContent=i===stages.length-1?'Start over ↻':'Next →';
  document.querySelectorAll('.dot').forEach((d,
  j)=>d.classList.toggle('active',
  i===j))
}stages.forEach((_,
j)=> {
  const b=document.createElement('button');
  b.className='dot';
  b.ariaLabel=`Go to stage ${j+1}`;
  b.onclick=()=> {
    i=j;
    render()
  };
  $('#dots').appendChild(b)
});
$('#back').onclick=()=> {
  if(i) {
    i--;
    render()
  }
};
$('#next').onclick=()=> {
  i=(i+1)%stages.length;
  render()
};
document.addEventListener('keydown',
e=> {
  if(e.key==='ArrowRight')$('#next').click();
  if(e.key==='ArrowLeft')$('#back').click()
});
render();
